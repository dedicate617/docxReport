name: Cross-Platform Build & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-dotnet:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x86, win-x64, linux-x64, linux-arm, linux-arm64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish ${{ matrix.rid }}
        run: |
          dotnet publish src/CrossReportRunner/CrossReportRunner.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -o dist/${{ matrix.rid }}

      - name: Package Release Assets
        run: |
          mkdir -p release-assets
          if [[ "${{ matrix.rid }}" == win* ]]; then
            cp "dist/${{ matrix.rid }}/CrossReportRunner.exe" "release-assets/CrossReportRunner-${{ matrix.rid }}.exe"
            (cd "dist/${{ matrix.rid }}" && zip -r "../../release-assets/CrossReportRunner-${{ matrix.rid }}.zip" .)
          else
            cp "dist/${{ matrix.rid }}/CrossReportRunner" "release-assets/CrossReportRunner-${{ matrix.rid }}"
            (cd "dist/${{ matrix.rid }}" && tar -czvf "../../release-assets/CrossReportRunner-${{ matrix.rid }}.tar.gz" .)
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.rid }}
          path: release-assets/*

  release:
    needs: build-dotnet
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all assets
        uses: actions/download-artifact@v4
        with:
          path: all-assets
          pattern: asset-*
          merge-multiple: true

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: all-assets/*
          generate_release_notes: true
